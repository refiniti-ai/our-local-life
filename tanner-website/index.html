<!DOCTYPE html>

  <meta name="twitter:card" content="summary" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "designbytanner",
        "url": "https://designbytanner.com/",
        "logo": "https://designbytanner.com/assets/T_FAVICON.svg",
        "description": "Creative design studio — new website coming soon."
      },
      {
        "@type": "WebSite",
        "url": "https://designbytanner.com/",
        "name": "designbytanner",
        "publisher": {
          "@type": "Organization",
          "name": "designbytanner"
        },
        "potentialAction": {
          "@type": "ReadAction",
          "target": "https://designbytanner.com/"
        }
      }
    ]
  }
  </script>
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.07);
      --glass-edge: rgba(255, 255, 255, 0.22);
      --accent: #e8d5b5;
      --accent-glow: rgba(232, 213, 181, 0.45);
      --text-soft: rgba(255, 250, 245, 0.88);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0c0c0c;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .stage video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Sound control — premium glass pill; sits clear of typical logo-safe zones */
    .sound-wrap {
      position: fixed;
      z-index: 2;
      right: max(1.25rem, env(safe-area-inset-right));
      bottom: max(1.25rem, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      pointer-events: none;
    }

    .sound-wrap > * {
      pointer-events: auto;
    }

    .sound-btn {
      appearance: none;
      border: 1px solid var(--glass-edge);
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.04) 100%
      );
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-soft);
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35) inset,
        0 8px 32px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(0, 0, 0, 0.2);
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.25s ease,
        background 0.2s ease;
    }

    .sound-btn:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.38);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.25) inset,
        0 10px 40px rgba(0, 0, 0, 0.45),
        0 0 36px var(--accent-glow);
    }

    .sound-btn:active {
      transform: scale(0.97);
    }

    .sound-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* On = sound available (unmuted); warm accent ring */
    .sound-btn[data-unmuted="true"] {
      border-color: rgba(232, 213, 181, 0.55);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.2) inset,
        0 8px 32px rgba(0, 0, 0, 0.35),
        0 0 28px var(--accent-glow);
    }

    .sound-btn svg {
      width: 1.35rem;
      height: 1.35rem;
      display: block;
    }

    .hint {
      margin: 0;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 250, 245, 0.55);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
      max-width: 10rem;
      text-align: right;
      line-height: 1.35;
    }

    .brand {
      position: fixed;
      z-index: 1;
      left: 50%;
      top: max(1rem, env(safe-area-inset-top));
      transform: translateX(-50%);
      margin: 0;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: rgba(255, 250, 245, 0.35);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      user-select: none;
    }

    @media (min-width: 769px) {
      .brand {
        font-size: 0.75rem;
      }
    }

    /* Screen-reader-only heading for semantics & SEO */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">
      designbytanner — coming soon. Official website launching shortly; premium design and branding.
    </h1>

    <noscript>
      <p style="margin: 0; padding: max(1rem, env(safe-area-inset-top)) 1rem; background: #0c0c0c; color: rgba(255,250,245,0.9); font-family: system-ui, sans-serif; text-align: center; position: relative; z-index: 3;">
        designbytanner — Coming soon. Please enable JavaScript for the full experience.
      </p>
    </noscript>

    <div class="stage">
      <video
        id="hero"
        playsinline
        autoplay
        muted
        loop
        preload="auto"
        aria-label="designbytanner intro animation"
      ></video>
    </div>

    <p class="brand">designbytanner</p>

    <div class="sound-wrap">
      <p class="hint" id="soundHint">Tap for sound</p>
      <button
        type="button"
        class="sound-btn"
        id="soundBtn"
        data-unmuted="false"
        aria-pressed="false"
        aria-label="Unmute video"
      >
        <!-- muted: speaker + slash -->
        <svg id="iconMuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9 H4 a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2l5 4V5z" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          <path d="M17.66 6.34a8 8 0 0 1 0 11.32" />
          <path d="M4 20 20 4" />
        </svg>
        <!-- unmuted -->
        <svg id="iconSound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none">
          <path d="M11 5 6 9 H4 a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2l5 4V5z" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          <path d="M17.66 6.34a8 8 0 0 1 0 11.32" />
        </svg>
      </button>
    </div>
  </main>

  <script>
    (function () {
      var DESKTOP = "assets/tanner%20logo%20animation%20complete%20intro.mp4";
      var MOBILE = "assets/tanner%20logo%20animation%20complete%20intro%20vertical.mp4";
      var MQ = window.matchMedia("(max-width: 768px)");

      var video = document.getElementById("hero");
      /* iOS inline playback */
      video.setAttribute("playsinline", "");
      video.playsInline = true;
      var btn = document.getElementById("soundBtn");
      var hint = document.getElementById("soundHint");
      var iconMuted = document.getElementById("iconMuted");
      var iconSound = document.getElementById("iconSound");

      var activeKey = "";

      function desiredSrc() {
        return MQ.matches ? MOBILE : DESKTOP;
      }

      function applySource() {
        var next = desiredSrc();
        if (next === activeKey) return;
        activeKey = next;
        var wasMuted = video.muted;
        video.removeAttribute("src");
        video.src = next;
        video.load();
        video.muted = wasMuted;
        video.play().catch(function () {});
      }

      function syncSoundUi() {
        var unmuted = !video.muted;
        btn.dataset.unmuted = unmuted ? "true" : "false";
        btn.setAttribute("aria-pressed", unmuted ? "true" : "false");
        btn.setAttribute("aria-label", unmuted ? "Mute video" : "Unmute video");
        iconMuted.style.display = unmuted ? "none" : "block";
        iconSound.style.display = unmuted ? "block" : "none";
        hint.textContent = unmuted ? "Sound on" : "Tap for sound";
      }

      function toggleSound() {
        video.muted = !video.muted;
        syncSoundUi();
        if (!video.muted) {
          video.play().catch(function () {});
        }
      }

      btn.addEventListener("click", function () {
        toggleSound();
      });

      video.addEventListener("volumechange", syncSoundUi);

      video.addEventListener("ended", function () {
        video.currentTime = 0;
        video.play().catch(function () {});
      });

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          video.play().catch(function () {});
        }
      });

      var resizeTimer;
      window.addEventListener(
        "resize",
        function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(applySource, 150);
        },
        { passive: true }
      );

      if (typeof MQ.addEventListener === "function") {
        MQ.addEventListener("change", applySource);
      } else {
        MQ.addListener(applySource);
      }

      applySource();
      syncSoundUi();
    })();
  </script>
</body>
</html>
